[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokechamp"
version = "0.1.0"
description = "Decision-support tools for Pokemon Champions: damage calculator, stat estimator, and RL move recommender, exposed to a local LLM via MCP."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pokechamp-mcp = "pokechamp.server:main"
pokechamp-chat = "pokechamp.llm.chat:main"
pokechamp-routing-eval = "pokechamp.llm.routing:main"

[project.optional-dependencies]
dev = ["pytest"]
sim = ["poke-env"]
llm = ["fastmcp", "httpx"]
rl = ["torch", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/pokechamp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
